[package]
name = "chip8_rs"
version = "0.1.0"
edition = "2021"
description = "A CHIP-8 emulator with an interactive debugger"
license = "MIT"
repository = "https://github.com/SylvanB/chip8-rs"
keywords = ["chip8", "emulator", "retro", "debugger"]
categories = ["emulators"]

[dependencies]
rand = "0.8"
minifb = "0.19.3"
clap = { version = "4", features = ["derive"] }
